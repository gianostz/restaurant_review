version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: restaurant-review-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - shared_pgdata:/var/lib/postgresql/data

volumes:
  shared_pgdata: